[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SUGFW-plus"
version = "1.0"
description = "SUGFW+ Project"
authors = [
    { name = "Xiaochuan Ma", email = "exclusive.xcm@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "scikit-learn",
    "scikit-image",
    "einops==0.6.1",
    "h5py==3.8.0",
    "icecream==2.1.3",
    "imageio==2.28.1",
    "MedPy==0.4.0",
    "nibabel==5.1.0",
    "monai==1.1.0",
    "numpy==1.23.1",
    "opencv_python==4.7.0.72",
    "pycocotools==2.0.6",
    "safetensors==0.3.1",
    "scipy==1.10.1",
    "SimpleITK==2.2.1",
    "tensorboardX==2.6",
    "tqdm==4.65.0",
    "ml-collections==0.1.1",
    "pycocotools==2.0.6",
    "onnx==1.14.0",
    "onnxruntime==1.14.1",
    "pandas==2.0.2",
]

[tool.setuptools]
packages = []

[project.urls]
Homepage = "https://github.com/Exclusivexc/SUGFW+"